{% extends 'base.html' %}
{% block title %}Page introuvable{% endblock %}

{% block content %}
<div class="text-center py-5">
  <div style="font-size:5rem;font-weight:800;color:var(--border-2)">404</div>
  <h2 class="mb-2">Page introuvable</h2>
  <p class="text-muted mb-4">La ressource demandée n'existe pas ou a été supprimée.</p>
  <div class="d-flex gap-2 justify-content-center">
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
      <i class="fa fa-chart-pie me-2"></i>Tableau de bord
    </a>
    <button onclick="history.back()" class="btn btn-outline-secondary">
      <i class="fa fa-arrow-left me-2"></i>Retour
    </button>
  </div>
</div>
{% endblock %}
